services:
  backend:
    image: node:20-alpine
    container_name: smartrecruit-backend
    restart: always
    working_dir: /app
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin123
      DB_NAME: smartrecruit
      JWT_SECRET: smartrecruit_secret_key
      NODE_ENV: development
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"

  frontend:
    image: node:20-alpine
    container_name: smartrecruit-frontend
    restart: always
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"