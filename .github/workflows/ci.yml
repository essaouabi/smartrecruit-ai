name: SmartRecruit AI CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Jest Tests
        run: node ./node_modules/jest/bin/jest.js --runInBand

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Dependencies
        run: npm ci

      - name: Check Package File
        run: |
          echo "Checking package.json"
          test -f package.json

      - name: Check Source Folder
        run: |
          echo "Checking src folder"
          test -d src

      - name: Check Tests Folder
        run: |
          echo "Checking tests folder"
          test -d tests

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=moderate || true