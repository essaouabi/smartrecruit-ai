name: SmartRecruit AI CI/CD

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartrecruit
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d smartrecruit"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 5000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: smartrecruit
      JWT_SECRET: smartrecruit_test_secret_key

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Backend Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test

      - name: Generate Backend Coverage
        run: npm run coverage

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Dependencies
        run: npm ci

      - name: Check Package File
        run: |
          echo "Checking package.json"
          test -f package.json

      - name: Check Source Folder
        run: |
          echo "Checking src folder"
          test -d src

      - name: Check Tests Folder
        run: |
          echo "Checking tests folder"
          test -d tests

      - name: Check Server File
        run: |
          echo "Checking server.js"
          test -f src/server.js

  security-check:
    name: Security Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean Install Dependencies
        run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=moderate || true